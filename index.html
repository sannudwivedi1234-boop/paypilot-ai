<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PayPilot AI</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
background:#f3f6fc;
color:#172033;
}
header{
background:#101b30;
color:white;
padding:22px;
font-size:25px;
font-weight:bold;
}
header span{color:#80a2ff}
main{max-width:900px;margin:25px auto;padding:15px}
h2{font-size:20px}
.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
}
.card,.panel{
background:white;
padding:20px;
border-radius:13px;
margin-bottom:15px;
box-shadow:0 2px 12px #00000008;
}
.card small{color:#68758b}
.card h2{font-size:25px;margin-bottom:0}
input,select,textarea{
width:100%;
padding:12px;
margin:7px 0 15px;
border:1px solid #dce2ec;
border-radius:8px;
font-size:15px;
}
button{
background:#315efb;
color:white;
border:0;
padding:12px 18px;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}
.green{background:#07966c}
.delete{background:#d83b3b;padding:7px}
.invoice{
border-top:1px solid #eee;
padding:15px 0;
display:flex;
justify-content:space-between;
gap:10px;
}
textarea{min-height:100px}
@media(max-width:600px){
.stats{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>PayPilot <span>AI</span></header>

<main>

<h1>Payment Dashboard</h1>
<p>Manage your invoices. Track payments. Get paid faster.</p>

<div class="stats">
<div class="card">
<small>Outstanding</small>
<h2 id="outstanding">$0</h2>
</div>

<div class="card">
<small>Total Invoices</small>
<h2 id="total">0</h2>
</div>

<div class="card">
<small>Received</small>
<h2 id="received">$0</h2>
</div>
</div>

<div class="panel">
<h2>Create Invoice</h2>

<form id="form">

<label>Client Name</label>
<input id="client" required placeholder="Client name">

<label>Amount (USD)</label>
<input id="amount" type="number" min="0.01" step="0.01" required placeholder="250">

<label>Due Date</label>
<input id="date" type="date" required>

<label>Project Name</label>
<input id="project" placeholder="Website Design">

<button type="submit">Add Invoice</button>

</form>
</div>

<div class="panel">
<h2>Payment Reminder Generator</h2>

<select id="choose">
<option value="">Select Invoice</option>
</select>

<select id="tone">
<option value="Friendly">Friendly</option>
<option value="Professional">Professional</option>
<option value="Firm">Firm</option>
</select>

<textarea id="message" placeholder="Your payment reminder will appear here"></
